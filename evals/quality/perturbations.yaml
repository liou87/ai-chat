# 人为改坏的回答：校准评分模型用的对照组。
# 人工标注的 20 条里几乎全是"通过"（忠实度、出处 20/20，回答到位 18/20），评分模型就算无脑判通过一致率也很高，
# 看不出它能不能抓出问题。所以从知行真实的好回答出发，每条只改一处，按构造"正确答案就是不通过"，
# 量评分模型在目标维度上判出 fail 的比例（检出率）。其余维度不计分。
#
# 每条：id、base（answers.json 里的原回答）、type、target（这一处改动应该让哪个维度不通过）、改法三选一：
#   edit: {old, new}            把原回答里唯一出现的一段替换掉
#   truncate_from: "..."        从这段开始往后全删
#   delete_between: [起, 止]    删掉"起"（含）到"止"（不含）之间的内容

